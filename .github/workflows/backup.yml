name: Auto Backup Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION="backup-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$VERSION" --title "Backup $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
