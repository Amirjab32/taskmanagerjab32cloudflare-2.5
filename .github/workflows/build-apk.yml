name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Copy Sound Assets to Android res/raw
        run: |
          mkdir -p android/app/src/main/res/raw
          cp -r public/sounds/* android/app/src/main/res/raw/ || true

      - name: Configure Android Permissions for Exact Alarms & Wakeup
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              const perms = [
                "android.permission.SCHEDULE_EXACT_ALARM",
                "android.permission.USE_EXACT_ALARM",
                "android.permission.WAKE_LOCK",
                "android.permission.RECEIVE_BOOT_COMPLETED",
                "android.permission.VIBRATE",
                "android.permission.POST_NOTIFICATIONS",
                "android.permission.SYSTEM_ALERT_WINDOW",
                "android.permission.FOREGROUND_SERVICE",
                "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
              ];
              perms.forEach(p => {
                if (!content.includes(p)) {
                  content = content.replace("</manifest>", `    <uses-permission android:name="${p}" />\n</manifest>`);
                }
              });
              if (!content.includes("showWhenLocked")) {
                content = content.replace("<activity", `<activity\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"`);
              }
              fs.writeFileSync(file, content);
            }
          '

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
